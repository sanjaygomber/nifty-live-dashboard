<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIVE NIFTY - FINAL FINAL - FUT OI FIXED</title>
<style>
body{font-family:Inter,Arial;background:#f6f7fb;margin:0;padding:18px;color:#111}
.h1{font-size:28px;font-weight:900;margin:0 0 6px 0}
.card{background:#fff;padding:18px;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.06);margin-bottom:16px}
.big{font-size:52px;font-weight:900;line-height:1} .mid{font-size:13px;color:#666;font-weight:700;text-transform:uppercase}
.up{color:#0f9d58;font-weight:800;font-size:22px} .down{color:#d93025;font-weight:800;font-size:22px}
.badge{padding:8px 14px;border-radius:999px;font-weight:800;font-size:14px;margin-top:8px;display:inline-block}
.b-long{background:#e6f4ea;color:#137333} .b-short{background:#fce8e6;color:#a50e0e} .b-neu{background:#f1f3f4;color:#444}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px} .kpi{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:12px 0}
.kpi>div{background:#f8f9fa;padding:12px;border-radius:10px;text-align:center} .kpi b{font-size:22px;display:block}
table{width:100%;border-collapse:collapse;font-size:16px} th,td{padding:10px 8px;border-bottom:1px solid #eee;text-align:right}
th{background:#f8f9fa;position:sticky;top:0} td:first-child,th:first-child{text-align:center;font-weight:800}
.live-dot{display:inline-block;width:10px;height:10px;background:#0f9d58;border-radius:50%;animation:blink 1s infinite;vertical-align:middle;margin-right:6px}
@keyframes blink{0%{opacity:1}50%{opacity:.2}100%{opacity:1}}
</style>
</head><body>
<div class="h1"><span class="live-dot"></span>LIVE NIFTY - FINAL FINAL - FUT OI FIXED</div>
<div id="topinfo" class="mid">Connecting LIVE...</div>
<div class="grid" style="margin-top:14px">
<div class="card"><div class="mid">NIFTY SPOT LIVE</div><div id="spot" class="big">--</div><div id="spotSub"></div></div>
<div class="card"><div class="mid" id="futHead">NIFTY FUTURES</div><div id="fut" class="big">--</div><div id="futSub"></div><div id="build"></div></div>
</div>
<div class="card">
<div class="kpi"><div><span class="mid">WEEKLY PCR OI</span><b id="wPcr">-</b></div><div><span class="mid">VOL PCR</span><b id="wVpcr">-</b></div><div><span class="mid">CE OI</span><b id="wCe">-</b><small id="wCeCh"></small></div><div><span class="mid">PE OI</span><b id="wPe">-</b><small id="wPeCh"></small></div><div><span class="mid">ATM</span><b id="wAtm">-</b></div></div>
<h2 id="wTitle">WEEKLY</h2><table id="wT"><thead><tr><th>Strike</th><th>CE LTP</th><th>CE Chg%</th><th>CE OI</th><th>PE OI</th><th>PE LTP</th><th>PE Chg%</th></tr></thead><tbody></tbody></table>
<div class="kpi" style="margin-top:22px"><div><span class="mid">MONTHLY PCR OI</span><b id="mPcr">-</b></div><div><span class="mid">VOL PCR</span><b id="mVpcr">-</b></div><div><span class="mid">CE OI</span><b id="mCe">-</b><small id="mCeCh"></small></div><div><span class="mid">PE OI</span><b id="mPe">-</b><small id="mPeCh"></small></div><div><span class="mid">ATM</span><b id="mAtm">-</b></div></div>
<h2 id="mTitle">MONTHLY</h2><table id="mT"><thead><tr><th>Strike</th><th>CE LTP</th><th>CE Chg%</th><th>CE OI</th><th>PE OI</th><th>PE LTP</th><th>PE Chg%</th></tr></thead><tbody></tbody></table>
</div>
<script>
async function load(){
try{
let ts=Date.now();
let url=`https://sanjaygomber.github.io/nifty-live-dashboard/live_data.json?nocache=${ts}`;
let r=await fetch(url,{cache:'no-store', headers:{'Cache-Control':'no-cache'}});
if(!r.ok) throw new Error('Start Colab - pushing to main');
let d=await r.json();
document.getElementById('topinfo').innerHTML=`LAST PUSH: <b>${d.time}</b> | NOW: ${new Date().toLocaleString('en-IN',{timeZone:'Asia/Kolkata'})} | AUTO 30s LIVE | WEEKLY ${d.weekly_expiry} | MONTHLY ${d.monthly_expiry} | PREM ${d.fut_premium} | OI ${d.fut_oi.toLocaleString()} | Colab pushing to main+data = NO 5 MIN CACHE`;
document.getElementById('spot').innerText=d.spot.toFixed(2);
document.getElementById('spotSub').innerHTML=`<span class="${d.change>=0?'up':'down'}">Prev: ${d.prev_close.toFixed(2)} | ${d.change>0?'+':''}${d.change.toFixed(2)} (${d.changepct.toFixed(2)}%)</span>`;
document.getElementById('futHead').innerText=`NIFTY FUTURES - ${d.fut_expiry} | Prem ${d.fut_premium}`;
document.getElementById('fut').innerText=d.fut_ltp.toFixed(2);
document.getElementById('futSub').innerHTML=`<span class="${d.fut_change>=0?'up':'down'}">Prev: ${d.fut_prev_close.toFixed(2)} | ${d.fut_change>0?'+':''}${d.fut_change.toFixed(2)} (${d.fut_changepct.toFixed(2)}%) | OI ${d.fut_oi.toLocaleString()} (${d.fut_oi_change>0?'+':''}${d.fut_oi_change.toLocaleString()})</span>`;
let cls=d.buildup.includes('Long Buildup')||d.buildup.includes('Short Cover')?'b-long':d.buildup.includes('Short Buildup')||d.buildup.includes('Long Unwind')?'b-short':'b-neu';
document.getElementById('build').innerHTML=`<span class="badge ${cls}">${d.buildup}</span>`;
document.getElementById('wPcr').innerText=d.weekly.pcr_oi; document.getElementById('wVpcr').innerText=d.weekly.vol_pcr;
document.getElementById('wCe').innerText=d.weekly.total_ce_oi.toLocaleString(); document.getElementById('wPe').innerText=d.weekly.total_pe_oi.toLocaleString();
document.getElementById('wCeCh').innerText=` ${d.weekly.total_ce_chg>0?'+':''}${d.weekly.total_ce_chg.toLocaleString()}`; document.getElementById('wPeCh').innerText=` ${d.weekly.total_pe_chg>0?'+':''}${d.weekly.total_pe_chg.toLocaleString()}`;
document.getElementById('wAtm').innerText=d.weekly.atm; document.getElementById('wTitle').innerText=`WEEKLY ${d.weekly_expiry} - ATM ${d.weekly.atm} ±5 (11 strikes)`;
document.getElementById('mPcr').innerText=d.monthly.pcr_oi; document.getElementById('mVpcr').innerText=d.monthly.vol_pcr;
document.getElementById('mCe').innerText=d.monthly.total_ce_oi.toLocaleString(); document.getElementById('mPe').innerText=d.monthly.total_pe_oi.toLocaleString();
document.getElementById('mCeCh').innerText=` ${d.monthly.total_ce_chg>0?'+':''}${d.monthly.total_ce_chg.toLocaleString()}`; document.getElementById('mPeCh').innerText=` ${d.monthly.total_pe_chg>0?'+':''}${d.monthly.total_pe_chg.toLocaleString()}`;
document.getElementById('mAtm').innerText=d.monthly.atm; document.getElementById('mTitle').innerText=`MONTHLY ${d.monthly_expiry} - ATM ${d.monthly.atm} ±5 (11 strikes)`;
function fill(id, chain){let tb=document.querySelector(`#${id} tbody`); tb.innerHTML=''; chain.sort((a,b)=>a.strike_price-b.strike_price).forEach(r=>{tb.innerHTML+=`<tr><td>${r.strike_price}</td><td>${(r.ce_ltp||0).toFixed(2)}</td><td>${(r.ce_changepct||r.ce_change||0)}</td><td>${(r.ce_oi||0).toLocaleString()}</td><td>${(r.pe_oi||0).toLocaleString()}</td><td>${(r.pe_ltp||0).toFixed(2)}</td><td>${(r.pe_changepct||r.pe_change||0)}</td></tr>`});}
fill('wT', d.weekly.chain); fill('mT', d.monthly.chain);
}catch(e){ document.getElementById('topinfo').innerText=`LIVE error: ${e.message} - Keep Colab running`; }
}
load(); setInterval(load, 30000);
</script></body></html>
